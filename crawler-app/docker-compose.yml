services:
  dataharvester:
    build: .
    image: dataharvester:1.0.0
    container_name: dataharvester
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    ports:
      # 只监听本机，避免直接暴露到公网；需要公网访问请用反向代理 + HTTPS
      - "127.0.0.1:8000:8000"
    volumes:
      # 宿主机目录需可写：mkdir -p data && sudo chown -R 1000:1000 data
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
