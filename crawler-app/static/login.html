<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060a13">
  <title>安全登录 · DataHarvester</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<div class="ambient" aria-hidden="true">
  <div class="ambient-grid"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="scan-beam"></div>
</div>

<main class="login-shell">
  <section class="login-visual">
    <div class="eyebrow"><span></span> DATA INTELLIGENCE PLATFORM</div>
    <h1>数据无界，<br><span>洞察有序。</span></h1>
    <p>将复杂网页转化为清晰、可用的结构化数据。<br>智能识别，精准提取，尽在你的本地控制台。</p>
    <div class="login-orbit" aria-hidden="true">
      <i class="orbit-ring ring-one"></i>
      <i class="orbit-ring ring-two"></i>
      <i class="orbit-ring ring-three"></i>
      <span class="orbit-core">DH</span>
      <b class="orbit-node node-one"></b>
      <b class="orbit-node node-two"></b>
      <em class="orbit-tag tag-one">HTML</em>
      <em class="orbit-tag tag-two">JSON</em>
      <em class="orbit-tag tag-three">OCR</em>
    </div>
    <div class="login-features">
      <span><i></i> 智能内容识别</span>
      <span><i></i> 可视化规则</span>
      <span><i></i> 本地数据存储</span>
    </div>
  </section>

  <section class="login-card">
    <div class="login-secure"><span class="dot"></span> SECURE ACCESS <small>PRIVATE CONSOLE</small></div>
    <div class="brand login-brand">
      <span class="logo" aria-hidden="true"><span class="logo-core">DH</span></span>
      <div class="brand-copy">
        <div class="brand-title"><strong>DataHarvester</strong><span class="version-badge">V1.5</span></div>
        <small>自托管网页数据采集系统</small>
      </div>
    </div>
    <div class="login-heading">
      <h2>欢迎回来</h2>
      <p>输入访问密码，进入你的数据工作台。</p>
    </div>
    <form id="login-form" autocomplete="off">
      <label class="label" for="password">访问密码</label>
      <div class="password-field">
        <input id="password" type="password" required autofocus
               placeholder="请输入 APP_PASSWORD" autocomplete="current-password">
      </div>
      <button class="primary block" id="login-btn" type="submit">进入控制台</button>
    </form>
    <p id="login-error" class="notice error" role="alert" hidden></p>
    <div class="login-note">
      <span>初始密码</span>
      <p class="muted small">首次部署未设置密码时，初始密码保存在服务器 <code>data/initial_password.txt</code>。</p>
    </div>
    <div class="login-footer"><span>ENCRYPTED SESSION</span><span>LOCAL &amp; PRIVATE</span></div>
  </section>
</main>
<script src="/static/login.js"></script>
</body>
</html>
