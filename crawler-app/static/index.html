<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataHarvester · 网页数据采集</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="logo">DH</span>
      <div>
        <strong>DataHarvester</strong>
        <small>自托管网页数据采集控制台</small>
      </div>
    </div>
    <div class="top-actions">
      <span class="dot" title="服务正常"></span>
      <span class="muted">已登录</span>
      <button class="ghost" id="logout">退出登录</button>
    </div>
  </header>

  <main class="layout">
    <!-- 左侧：任务配置 -->
    <section class="panel">
      <h2>新建采集任务</h2>

      <label class="label">数据来源</label>
      <div class="segmented" id="source-tabs">
        <button class="active" data-source="url">网页链接</button>
        <button data-source="html">粘贴 / 上传 HTML</button>
      </div>

      <div id="pane-url">
        <input id="url" type="text" spellcheck="false"
               placeholder="https://example.com/list?page={page}">
        <p class="hint">多页采集时在 URL 中用 <code>{page}</code> 占位，例如
          <code>https://a.com/list?page={page}</code>，页数填 3 即抓 1~3 页。</p>
      </div>

      <div id="pane-html" hidden>
        <textarea id="html" rows="7" spellcheck="false"
                  placeholder="把网页源代码粘贴到这里，或选择本地 .html 文件"></textarea>
        <div class="row">
          <input id="base-url" type="text" spellcheck="false"
                 placeholder="基准 URL（可选，用于补全相对链接）">
          <label class="file-btn">
            选择文件
            <input id="html-file" type="file" accept=".html,.htm,.txt" hidden>
          </label>
        </div>
      </div>

      <div class="grid2">
        <div>
          <label class="label" for="mode">提取方式</label>
          <select id="mode">
            <option value="table">自动识别表格</option>
            <option value="css">CSS 选择器（列表 / 卡片）</option>
            <option value="article">正文文章</option>
          </select>
        </div>
        <div>
          <label class="label" for="browser">页面渲染</label>
          <select id="browser">
            <option value="0">静态请求（快）</option>
            <option value="1">浏览器渲染（JS 页面）</option>
          </select>
        </div>
        <div>
          <label class="label" for="pages">页数</label>
          <input id="pages" type="number" min="1" max="20" value="1">
        </div>
        <div>
          <label class="label" for="delay">请求间隔（秒）</label>
          <input id="delay" type="number" min="0" max="10" step="0.1" value="0.8">
        </div>
      </div>

      <div id="table-options" class="option-block">
        <div class="grid2">
          <div>
            <label class="label" for="table-index">表格序号（留空 = 自动选最大）</label>
            <input id="table-index" type="number" min="0" placeholder="自动">
          </div>
          <label class="check">
            <input id="first-row-header" type="checkbox">
            首行作为表头
          </label>
        </div>
      </div>

      <div id="css-options" class="option-block" hidden>
        <label class="label" for="item-selector">条目选择器</label>
        <input id="item-selector" type="text" spellcheck="false"
               placeholder="例如 div.product-item">
        <label class="label">字段映射</label>
        <div id="fields"></div>
        <button class="ghost small" id="add-field" type="button">+ 添加字段</button>
        <p class="hint">属性填 <code>text</code> 取文本；填 <code>href</code>、<code>src</code>
          取链接；填 <code>html</code> 取内部 HTML。字段选择器留空表示取条目自身。</p>
      </div>

      <label class="check">
        <input id="ignore-robots" type="checkbox">
        忽略 robots.txt（请确认你拥有抓取授权）
      </label>

      <div class="actions">
        <button class="ghost" id="analyze" type="button">分析页面结构</button>
        <button class="primary" id="run" type="button">开始抓取</button>
      </div>

      <div id="notice" class="notice" hidden></div>

      <div id="analysis" class="analysis" hidden>
        <h3>页面分析</h3>
        <div id="analysis-summary" class="muted"></div>
        <div id="analysis-tables"></div>
        <div id="analysis-article" class="article-preview" hidden></div>
      </div>
    </section>

    <!-- 中间：结果 -->
    <section class="panel results">
      <div class="results-head">
        <h2>采集结果</h2>
        <span id="job-status" class="pill idle">等待任务</span>
      </div>
      <div id="job-meta" class="meta-line muted">在左侧配置并开始抓取，结果会显示在这里。</div>
      <div id="exports" class="exports" hidden></div>
      <div id="stats" class="stats"></div>
      <div id="preview" class="preview"></div>
    </section>

    <!-- 右侧：历史 -->
    <aside class="panel history">
      <div class="results-head">
        <h2>历史任务</h2>
        <button class="ghost small" id="refresh-history" type="button">刷新</button>
      </div>
      <div id="history-list" class="history-list">
        <p class="muted small">暂无任务</p>
      </div>
    </aside>
  </main>

  <footer class="footer">
    仅用于采集你有权访问的公开数据；请遵守目标站点服务条款、robots.txt 与当地法律法规。
  </footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
